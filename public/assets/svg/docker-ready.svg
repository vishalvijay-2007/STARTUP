<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="dockerGrad" x1="40" y1="20" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B66FF"/>
      <stop offset="100%" stop-color="#3C2DB8"/>
    </linearGradient>
    <filter id="dockerGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6355F4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="20" fill="url(#dockerGrad)" filter="url(#dockerGlow)"/>

  <!-- Grid overlay -->
  <path d="M20 40h280M20 80h280M20 120h280M20 160h280" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M60 20v160M120 20v160M180 20v160M240 20v160" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Containers Stack -->
  <g transform="translate(60, 45)" fill="#FFFFFF" fill-opacity="0.9">
    <!-- Top row -->
    <rect x="70" y="0" width="26" height="20" rx="3"/>
    <rect x="102" y="0" width="26" height="20" rx="3"/>
    <!-- Middle row -->
    <rect x="38" y="25" width="26" height="20" rx="3"/>
    <rect x="70" y="25" width="26" height="20" rx="3"/>
    <rect x="102" y="25" width="26" height="20" rx="3"/>
    <rect x="134" y="25" width="26" height="20" rx="3"/>
    <!-- Bottom row -->
    <rect x="6" y="50" width="26" height="20" rx="3"/>
    <rect x="38" y="50" width="26" height="20" rx="3"/>
    <rect x="70" y="50" width="26" height="20" rx="3"/>
    <rect x="102" y="50" width="26" height="20" rx="3"/>
    <rect x="134" y="50" width="26" height="20" rx="3"/>
    <rect x="166" y="50" width="26" height="20" rx="3"/>
  </g>

  <!-- Whale silhouette / Wave curve -->
  <path d="M40 145 C90 145 130 155 180 155 C230 155 260 140 280 135 C285 155 270 170 240 170 C160 170 120 170 40 170 Z" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <text x="160" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DOCKER CONTAINERIZED</text>
  <text x="160" y="178" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#E0E7FF" text-anchor="middle" letter-spacing="1.5">MULTI-STAGE • NGINX • NODE.JS • NON-ROOT</text>
</svg>
