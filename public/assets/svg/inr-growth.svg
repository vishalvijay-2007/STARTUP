<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="areaGrad" x1="160" y1="60" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6355F4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6355F4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="40" y1="160" x2="280" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B7BFF"/>
      <stop offset="100%" stop-color="#6355F4"/>
    </linearGradient>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6355F4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Grid Lines -->
  <line x1="40" y1="180" x2="280" y2="180" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="280" y2="140" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="100" x2="280" y2="100" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="60" x2="280" y2="60" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Chart Area Fill -->
  <path d="M40 160 Q80 150 110 130 T170 120 T220 85 T280 55 L280 180 L40 180 Z" fill="url(#areaGrad)"/>

  <!-- Chart Trend Line -->
  <path d="M40 160 Q80 150 110 130 T170 120 T220 85 T280 55" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Milestone Data Points -->
  <circle cx="110" cy="130" r="4.5" fill="#FFFFFF" stroke="#6355F4" stroke-width="2.5"/>
  <circle cx="170" cy="120" r="4.5" fill="#FFFFFF" stroke="#6355F4" stroke-width="2.5"/>
  <circle cx="220" cy="85" r="4.5" fill="#FFFFFF" stroke="#6355F4" stroke-width="2.5"/>
  <circle cx="280" cy="55" r="6" fill="#6355F4" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Rupee Currency Badge -->
  <g transform="translate(30, 25)" filter="url(#badgeShadow)">
    <rect width="44" height="44" rx="14" fill="#6355F4"/>
    <!-- Indian Rupee Symbol Vector -->
    <path d="M16 14h12M16 18h12M16 14v16M21 14c4 0 7 1.5 7 5s-3 5-7 5l8 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Metric Callout Badge -->
  <g transform="translate(190, 20)" filter="url(#badgeShadow)">
    <rect width="85" height="28" rx="8" fill="#10B981"/>
    <text x="42" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">+148% INR</text>
  </g>
</svg>
